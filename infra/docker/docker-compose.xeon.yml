# infra/docker/docker-compose.xeon.yml — 제온(192.168.0.101) 임시 백엔드 오버레이.
#
# 프로덕션 compose 위에 **덧씌워** 쓴다(단독 사용 금지):
#   docker compose -f infra/docker/docker-compose.prod.yml \
#                  -f infra/docker/docker-compose.xeon.yml up -d
#
# ⚠️ **DCP 파이프라인 영구 철수 확정(운영자, 2026-08-17)** — 제온은 이제 gachinol 단독 사용이다.
#    그에 맞춰 **DCP 상호배제를 해제**했다(아래 ④). 아래 ①②③은 철수 완료 통보 후 [A-2]에서 재설계한다
#    — 지금 리소스 리밋을 풀면 철수 도중의 DCP와 자원 경합이 생기므로 **순서상 아직 손대지 않는다**.
#
# (철수 전 전제) 제온은 **가동 중인 DCP 파이프라인**(dcpx-api/worker/redis/caddy)과 호스트를 공유했다.
# 이 오버레이의 목적은 그 공존을 안전하게 만드는 것이었다:
#   ① 리소스 하드리밋 — DCP worker 상한 26GiB + 우리 몫 < 물리 32GB, 최소 6GB 여유 확보 (**[A-2] 재설계 대상**)
#   ② 포트 격리 — dcpx-caddy(:443)·dcpx-api(:8080)와 겹치지 않는 포트만 사용(4000·9000·9001·8081)
#   ③ host net 금지 — 전부 bridge. 호스트 도달은 extra_hosts로만
#   ④ ~~DCP 상호배제~~ — **해제됨(2026-08-17)**. `DCP_ARBITER_URL`을 제거해 `DcpArbiterService`가
#      `enabled=false`로 부팅하며 미디어 큐가 상시 가동된다. **DCP api가 사라지기 전에 이 해제를 먼저
#      해야 한다** — 기본 fail-mode가 `hold`라 조회 실패 시 `dcp_unreachable`로 큐가 영구 정지하기 때문이다
#      (대장 #90이 실제로 밟은 경로). 코드(`services/api/src/arbiter/`)는 **남겨 둔다**: 제온 외 환경
#      대비 + 회귀 이력 보존이며, 제거는 별도 판단이다
#   ⑤ MinIO — 제온엔 오브젝트 스토리지가 없다(프로덕션은 R2. 여기선 로컬 S3 등가물)
#   ⑥ web(nginx) — 3앱 정적 서빙 + api/go. 리버스 프록시. 서브도메인 5종 vhost 골격(T-W0-03).
#      nginx.conf·Dockerfile.web 상세는 그 두 파일 자체 주석 참조.
#
# 노출 범위는 LAN 한정이다(결정 사항). nftables가 input DROP이므로 아래 포트를
# 192.168.0.0/24에 허용해야 앱에서 접근된다 — 그 방화벽 변경은 DCP 박스 설정이므로 별도 승인 후 수행.
#
# ── 제온 외부(인터넷) 노출 경로 — 미확정, 실 연결 보류(G9 ②, T-NC-02 접수 기록 참조) ──────────
# 계획(08§D)의 선택지는 Cloudflare Tunnel(cloudflared) / 포트 개방(방화벽 허용 규칙) 2안이며, W0 착수
# (2026-08-08) + 4주 초과(2026-09-05) 시 승인 없으면 Tunnel 단독안으로 자동 확정된다. 사용자가 검토 중이라
# 언급한 Tailscale은 이 2안 밖 후보라 **채택 전까지 구현하지 않는다**
# (reviews/dod-evidence/w0/T-NC-02-g9-receipt.md ② 참조). 아래는 Tunnel 안을 08§D 자동 확정 방향에 맞춰
# **설정 코드만 미리 작성**한 것 — 주석 해제 전까지는 `docker compose config`에도 이 서비스가 나타나지
# 않는다(실제로 아무것도 적용되지 않은 상태). 활성화 절차(사용자 확정 후): ① Cloudflare Zero Trust에서
# 터널 생성 → 토큰 발급 ② infra/docker/env.example의 CLOUDFLARE_TUNNEL_TOKEN을 .env에 채움
# ③ 아래 블록 주석 해제 ④ 터널 라우팅에서 각 서브도메인 → 이 compose 네트워크 내부의 web:80 / api:4000
# (WS 포함)로 연결. 포트 개방을 택할 경우 이 서비스는 불필요 — 대신 nftables에 web(80)·api(4000)
# LAN→인터넷 허용 규칙을 추가한다(OS 방화벽 설정이라 이 compose 파일의 소관이 아니다 — 별도 승인 필요,
# 여기서는 그 대체 경로가 있다는 사실만 기록한다).
#
# cloudflared:
#   image: cloudflare/cloudflared:latest
#   restart: unless-stopped
#   command: tunnel run
#   environment:
#     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN 필요(.env) — Tunnel 채택 확정 후 설정}
#   depends_on:
#     web:
#       condition: service_healthy
#     api:
#       condition: service_healthy
#   deploy:
#     resources:
#       limits: { memory: 128m }

services:
  api:
    environment:
      # DCP_ARBITER_URL 없음 = 상호배제 **비활성**(DCP 영구 철수, 2026-08-17 — 헤더 ④ 참조).
      # `DcpArbiterService.onModuleInit`이 이 키 하나로 게이트하므로 **행 제거만으로 완전 비활성**이다.
      # `DCP_ARBITER_FAIL_MODE=run` 같은 우회는 쓰지 않았다 — 그건 "조회는 하되 실패를 무시"라
      # 없는 서버에 계속 요청을 보내게 된다. 목적은 완전 비활성이다.
      S3_ENDPOINT: http://minio:9000
      # 앱(실기기·시뮬)이 받는 서명 URL의 호스트 — 컨테이너 내부명이 아니라 LAN 주소여야 한다
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://192.168.0.101:9000}
      S3_FORCE_PATH_STYLE: 'true'
    # 유지: 이 오버레이가 bridge 전용이라(헤더 ③) 호스트 루프백 도달 수단을 남겨 둔다.
    # 실측(2026-08-17) 결과 현재 유일한 소비자였던 DCP_ARBITER_URL이 사라져 **참조는 0**이지만,
    # 제거는 호스트 도달이 필요한 다음 용도가 나올 때 함께 판단한다(지시에 따라 이번 범위 밖).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - '${API_PORT_PUBLISH:-4000}:4000'
    deploy:
      resources:
        limits: { memory: 1g }

  # 트랜스코딩 = CPU 경합의 주범. DCP encoding이 32코어를 전부 쓰므로(dcpomatic -t 32)
  # 동시성 1 + CPU 상한으로 조이고, 그 위에 아비터가 큐 자체를 정지시킨다(이중 방어).
  media-worker:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_WORKER_CONCURRENCY: '1'
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '8', memory: 2g }

  ai-worker:
    deploy:
      resources:
        limits: { memory: 1g }

  postgres:
    deploy:
      resources:
        limits: { memory: 1g }

  redis:
    deploy:
      resources:
        limits: { memory: 512m }

  # 프로덕션은 Cloudflare R2지만 제온엔 오브젝트 스토리지가 없다 → S3 호환 로컬 대체.
  # 코드는 S3_ENDPOINT만 보므로 R2 전환 시 이 서비스를 빼고 env만 바꾸면 된다.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 필요(.env)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY 필요(.env)}
    volumes: [miniodata:/data]
    ports:
      # 앱이 서명 URL로 직접 미디어를 주고받는다 → LAN 노출 필요(콘솔 9001은 선택)
      - '${MINIO_PORT_PUBLISH:-9000}:9000'
      - '${MINIO_CONSOLE_PORT_PUBLISH:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }

  # 버킷 1회 생성(로컬 개발 compose와 동일 패턴)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}
      && mc mb --ignore-existing local/${S3_BUCKET:-gachinol-media}"
    restart: 'no'

  # nginx 정적 서빙 + api/go. 리버스 프록시 (T-W0-03 골격). prod compose에는 없는 xeon 전용 서비스 —
  # 이 임시 백엔드가 도메인·CF 없이도 LAN에서 웹 3앱을 서빙/검증할 수 있게 한다.
  # 산출물 출처: 이 서비스 자체가 멀티스테이지 빌드로 3앱 `expo export --platform web`을 수행한다
  # (Dockerfile.web 주석 참조) — 별도 CI 아티팩트 주입·볼륨 마운트 불요.
  web:
    # ⚠️ `image:`가 없으면 `docker compose pull web`이 "빌드 대상"이라며 건너뛰고 `up`이 **제온에서
    # 재빌드**를 시도한다 — DCP 파이프라인과 CPU를 공유하는 호스트에서 금지 사항이며, Dockerfile.web
    # 주석이 선언한 "CI가 만든 이미지를 pull && up으로 배포"가 성립하지 않는다(T-W1-11c 구현자 발견,
    # 대장 #143). **기본값은 compose가 자동 생성하던 태그와 동일**하므로(프로젝트명 `gachinol-prod` +
    # 서비스명 `web`) 로컬 빌드 흐름은 무회귀이고, CI 배포는 `WEB_IMAGE`로 GHCR 태그를 주입한다.
    image: ${WEB_IMAGE:-gachinol-prod-web}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # 웹 번들에 빌드 시점 인라인(런타임 env 아님) — 도메인 미확정이라 기본값은 제온 LAN IP
        # (S3_PUBLIC_ENDPOINT와 동일 패턴). 도메인 확정 후 WEB_EXPO_PUBLIC_API_URL로 재정의.
        EXPO_PUBLIC_API_URL: ${WEB_EXPO_PUBLIC_API_URL:-http://192.168.0.101:4000}
    restart: unless-stopped
    environment:
      # server_name 치환용(컨테이너 시작 시 envsubst) — 미확정 도메인은 gachinol.local로 대체,
      # 실제로는 어떤 Host 헤더도 이 값과 일치하지 않으므로 default_server(444)로 안전하게 막힌다.
      DOMAIN: ${DOMAIN:-gachinol.local}
      # Cloudflare Quick Tunnel의 임시 호스트 1개만 허용하는 vhost용(nginx.conf "터널 노출 vhost").
      # 미설정 기본값 tunnel.invalid는 실재하지 않는 TLD라 어떤 요청도 매칭되지 않는다 = 노출 0.
      # 터널 URL이 바뀌면 이 값만 교체하고 `web`을 재기동한다(이미지 재빌드 불요).
      TUNNEL_HOST: ${TUNNEL_HOST:-tunnel.invalid}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # LAN 검증용(모바일 실기기 워크플로와 동일 원칙, CLAUDE.md §9). 인터넷 노출은 별건(G9 ②, 위 참조).
      - '${WEB_PORT_PUBLISH:-8081}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256m }

volumes:
  miniodata: {}
