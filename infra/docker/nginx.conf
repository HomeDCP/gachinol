# infra/docker/nginx.conf — 제온 `web` 컨테이너의 nginx 메인 설정 (T-W0-03, 골격).
#
# 소비: infra/docker/Dockerfile.web 이 이 파일을 이미지에 `/etc/nginx/nginx.conf.template`로 넣고,
# 컨테이너 시작 시 envsubst로 DOMAIN 환경변수 값을 채운 뒤 `/etc/nginx/nginx.conf`로 기동한다
# (빌드 시점이 아니라 **컨테이너 시작 시점** 치환 — 같은 이미지를 도메인 확정 전/후 재사용 가능, G9 ① 참조).
# 주의(치환 대상 표기): 아래 server_name 줄에 쓰인 DOMAIN 자리 표시자가 이 파일에서 유일한 envsubst
# 치환 지점이다 — 이 안내 주석 자체에는 그 실제 문법 토큰을 반복해 적지 않는다(적으면 envsubst가 이
# 주석 문장까지 치환해버려 컨테이너 안 실제 설정 파일에서 안내문이 깨져 보인다). nginx 자체 변수
# ($host·$uri 등)는 전부 소문자·중괄호 없이 사용해 그 치환 지점과 겹치지 않는다.
#
# 범위 경계(중요, E2 T-W0-03 vs T-W1-06): 이 골격은 **정적 자산 서빙만** 다룬다. `/watch/:id` 같은
# expo-router 동적 라우트에 대한 SPA 폴백(`try_files ... /index.html`)과 그에 딸린 HTML no-cache 헤더
# 정합은 **T-W1-06 소관**이다(02§D-T5 "동적 라우트 서빙" 소절, E2 T-W1-06 산출물란). 이 파일은 T-W1-06이
# 이어서 수정할 **준-공용 자산**이다(E3 §B) — 아래 각 정적 서버 블록의 `location /`는 매칭 실패 시
# 404를 반환하는 순수 정적 서빙이며, 그 자리가 T-W1-06이 폴백 규칙을 넣을 지점이다.
#
# 서브도메인 5종 역할 분리(02§D-T5·D-T6 판단, 검토 근거는 완료 보고 "검토 요약" 참조):
#   watch. / reporter. / center.  → 정적 서빙(각 앱 `expo export --platform web` 산출물)
#   api.                          → services/api(NestJS, REST+WS)로 리버스 프록시
#   go.                           → **정적 아님** — D-T6 기본안이 `go.<도메인>/c/<id>`를 api 경량 라우트
#                                    (T-W1-05, OG SSR 후 리다이렉트)로 확정했으므로 api.와 동일 업스트림으로
#                                    프록시한다. 이 태스크는 라우트 자체를 구현하지 않는다(T-W1-05 소관) —
#                                    지금은 그 라우트가 나중에 얹힐 자리(vhost)만 마련한다.

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile     on;
  tcp_nopush   on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Docker 임베디드 DNS(모든 user-defined bridge 네트워크 공통 주소). api.·go. 프록시가 이걸 써야 하는
  # 이유: proxy_pass에 "api:4000"처럼 리터럴 호스트명을 그대로 쓰면 nginx가 **설정 로드 시 1회만** DNS를
  # 조회해 고정한다 — depends_on으로 기동 순서를 맞춰도, ①api 컨테이너가 재기동해 IP가 바뀌면 nginx 재시작
  # 전까지 옛 IP로 계속 프록시하고 ②api 없이 nginx 단독 기동/테스트(`nginx -t`)만 해도 즉시 실패한다
  # (`host not found in upstream`, 이 파일 초안에서 실제로 재현됨 — 게이트① 로그 참조).
  # 아래처럼 resolver + 변수(proxy_pass 안의 $upstream_api)를 쓰면 해석을 **요청 시점**으로 미뤄 두 문제를
  # 모두 없앤다(표준 관용구).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 알 수 없는 Host 헤더(=아직 이 서버에 등록 안 된 서브도메인·IP 직접 접근)는 vhost 스푸핑·정보노출
  # 방지를 위해 즉시 끊는다. 컨테이너 헬스체크(Host 헤더 없음/무의미)만 예외로 통과시킨다.
  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 444;
    }
  }

  # ── 정적 서빙 3종 공통 패턴(watch/reporter/center) ──────────────────────────
  # 해시 파일명 자산(js/css/이미지/폰트)은 콘텐츠가 바뀌면 URL도 바뀌므로 장기 캐시가 안전하다
  # (D-T5 서비스워커 갱신 정책의 전제 1번 — 이 캐시 규칙이 성립해야 그 정책이 의미가 있다).
  # HTML 문서는 반대로 즉시 재검증이 필요하다(해시 자산을 참조하는 진입점이 캐시되면 갱신이 막힌다) —
  # 이 no-cache 자체는 이미 항상 참인 정적 서빙 원칙이라 이번 골격에 포함한다(SPA 폴백과는 무관 — 그건
  # "어떤 URL이 index.html에 도달하는가"의 문제이고, 이건 "index.html이 캐시되면 안 된다"는 별개 규칙).
  # Cloudflare 캐시와의 역할 분담: 위 두 Cache-Control은 **오리진(nginx) 응답 헤더**이고, Cloudflare는
  # 이를 존중해 해시 자산은 엣지에서도 장기 캐시, HTML은 엣지에서도 매 요청 재검증하는 것이 골격 의도다
  # (Cloudflare 측 Cache Rules 실 설정은 실계정 부재로 이번 태스크 범위 밖 — 아래 안내 참조).

  server {
    listen 80;
    server_name watch.${DOMAIN};
    root /usr/share/nginx/html/watch;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # 정적 자산만(동적 라우트 rewrite는 T-W1-06) — 매칭 실패 시 404
    location / {
      try_files $uri $uri/ =404;
    }
  }

  server {
    listen 80;
    server_name reporter.${DOMAIN};
    root /usr/share/nginx/html/reporter;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }

  server {
    listen 80;
    server_name center.${DOMAIN};
    root /usr/share/nginx/html/center;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }

  # ── api. / go. — 정적 아님, services/api(NestJS)로 리버스 프록시 ───────────────
  # api 컨테이너는 REST + socket.io(WS, 라이브 채팅·프롬프터)를 같은 포트(4000)에서 인프로세스로
  # 서빙한다(CLAUDE.md §11) — Upgrade/Connection 헤더를 넘겨야 WS 핸드셰이크가 통과한다.
  server {
    listen 80;
    server_name api.${DOMAIN};

    location / {
      set $upstream_api api:4000;
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  server {
    listen 80;
    server_name go.${DOMAIN};

    # go.<도메인>/c/<id> 자체(OG SSR·리다이렉트 로직)는 T-W1-05가 api 라우트로 구현한다(D-T6 기본안).
    # 이 vhost는 그 라우트가 이미 떠 있는 동일 api 업스트림으로 도달하는 자리만 마련한다.
    location / {
      set $upstream_api api:4000;
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
