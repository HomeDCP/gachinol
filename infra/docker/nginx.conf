# infra/docker/nginx.conf — 제온 `web` 컨테이너의 nginx 메인 설정 (T-W0-03, 골격).
#
# 소비: infra/docker/Dockerfile.web 이 이 파일을 이미지에 `/etc/nginx/nginx.conf.template`로 넣고,
# 컨테이너 시작 시 envsubst로 DOMAIN 환경변수 값을 채운 뒤 `/etc/nginx/nginx.conf`로 기동한다
# (빌드 시점이 아니라 **컨테이너 시작 시점** 치환 — 같은 이미지를 도메인 확정 전/후 재사용 가능, G9 ① 참조).
# 주의(치환 대상 표기): 아래 server_name 줄에 쓰인 DOMAIN 자리 표시자가 이 파일에서 유일한 envsubst
# 치환 지점이다 — 이 안내 주석 자체에는 그 실제 문법 토큰을 반복해 적지 않는다(적으면 envsubst가 이
# 주석 문장까지 치환해버려 컨테이너 안 실제 설정 파일에서 안내문이 깨져 보인다). nginx 자체 변수
# ($host·$uri 등)는 전부 소문자·중괄호 없이 사용해 그 치환 지점과 겹치지 않는다.
#
# 범위 경계(중요, E2 T-W0-03 vs T-W1-06): 이 골격 자체(vhost 5종·정적 자산 캐시 규칙·api/go. 프록시)는
# T-W0-03 산출물이다. `/watch/:id` 같은 expo-router 동적 라우트에 대한 SPA 폴백(`try_files ... /index.html`)과
# 그에 딸린 HTML no-cache 헤더 정합은 T-W1-06이 아래 각 정적 서버 블록의 `location /`에 적용했다(02§D-T5
# "동적 라우트 서빙" 소절, E2 T-W1-06 산출물란 — 세부 근거는 "정적 서빙 3종 공통 패턴" 주석 참조). 이 파일은
# 계속 **준-공용 자산**이다(E3 §B).
#
# 닫힌 목록 아님(EXEC-DECISIONS #6/D6-2): 아래 SPA 폴백은 URL 패턴을 개별 열거하지 않는 범용 규칙이라
# 향후 신설되는 동적 라우트(예: T-W2-09의 `/upload/:token`)도 이 파일을 다시 고치지 않고 자동으로 커버된다
# — 그럼에도 "그 시점 전수" 패턴 목록 주석(아래)의 갱신은 신설 태스크가 동반 소유한다(추측 선제 추가 금지).
#
# 서브도메인 5종 역할 분리(02§D-T5·D-T6 판단, 검토 근거는 완료 보고 "검토 요약" 참조):
#   watch. / reporter. / center.  → 정적 서빙(각 앱 `expo export --platform web` 산출물)
#   api.                          → services/api(NestJS, REST+WS)로 리버스 프록시
#   go.                           → **정적 아님** — D-T6 기본안이 `go.<도메인>/c/<id>`를 api 경량 라우트
#                                    (T-W1-05, OG SSR 후 리다이렉트)로 확정했으므로 api.와 동일 업스트림으로
#                                    프록시한다. 이 태스크는 라우트 자체를 구현하지 않는다(T-W1-05 소관) —
#                                    지금은 그 라우트가 나중에 얹힐 자리(vhost)만 마련한다.

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile     on;
  tcp_nopush   on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Docker 임베디드 DNS(모든 user-defined bridge 네트워크 공통 주소). api.·go. 프록시가 이걸 써야 하는
  # 이유: proxy_pass에 "api:4000"처럼 리터럴 호스트명을 그대로 쓰면 nginx가 **설정 로드 시 1회만** DNS를
  # 조회해 고정한다 — depends_on으로 기동 순서를 맞춰도, ①api 컨테이너가 재기동해 IP가 바뀌면 nginx 재시작
  # 전까지 옛 IP로 계속 프록시하고 ②api 없이 nginx 단독 기동/테스트(`nginx -t`)만 해도 즉시 실패한다
  # (`host not found in upstream`, 이 파일 초안에서 실제로 재현됨 — 게이트① 로그 참조).
  # 아래처럼 resolver + 변수(proxy_pass 안의 $upstream_api)를 쓰면 해석을 **요청 시점**으로 미뤄 두 문제를
  # 모두 없앤다(표준 관용구).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # 알 수 없는 Host 헤더(=아직 이 서버에 등록 안 된 서브도메인·IP 직접 접근)는 vhost 스푸핑·정보노출
  # 방지를 위해 즉시 끊는다. 컨테이너 헬스체크(Host 헤더 없음/무의미)만 예외로 통과시킨다.
  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 444;
    }
  }

  # ── 정적 서빙 3종 공통 패턴(watch/reporter/center) ──────────────────────────
  # 해시 파일명 자산(js/css/이미지/폰트)은 콘텐츠가 바뀌면 URL도 바뀌므로 장기 캐시가 안전하다
  # (D-T5 서비스워커 갱신 정책의 전제 1번 — 이 캐시 규칙이 성립해야 그 정책이 의미가 있다).
  # HTML 문서는 반대로 즉시 재검증이 필요하다(해시 자산을 참조하는 진입점이 캐시되면 갱신이 막힌다) —
  # 이 no-cache 자체는 이미 항상 참인 정적 서빙 원칙이라 이번 골격에 포함한다(SPA 폴백과는 무관 — 그건
  # "어떤 URL이 index.html에 도달하는가"의 문제이고, 이건 "index.html이 캐시되면 안 된다"는 별개 규칙).
  # Cloudflare 캐시와의 역할 분담: 위 두 Cache-Control은 **오리진(nginx) 응답 헤더**이고, Cloudflare는
  # 이를 존중해 해시 자산은 엣지에서도 장기 캐시, HTML은 엣지에서도 매 요청 재검증하는 것이 골격 의도다
  # (Cloudflare 측 Cache Rules 실 설정은 실계정 부재로 이번 태스크 범위 밖 — 아래 안내 참조).
  #
  # SPA 폴백(T-W1-06, 02§D-T5 "동적 라우트 서빙"): expo-router `output: 'static'`은 빌드 시점에 값이
  # 확정되는 라우트만 파일로 사전 렌더링한다(실측 `expo export --platform web` 산출물은 평평한
  # `<route>.html` — 예: `live.html`·`watch/[id].html`(리터럴 대괄호 파일명, 실제 id로는 매칭 안 됨)).
  # `/watch/:id`·`/live/:id`·`/contents/:id`·`/recommendations/:id`처럼 실제 값이 붙는 요청은 대응 파일이
  # 없어 그대로 두면 404고, 그 자리에서 카톡 `go.` 리다이렉트 도달이 끝난다(02§D-T5 "문제" 소절). 아래
  # 각 `location /`의 `try_files $uri $uri.html $uri/ /index.html;`은 실제 정적 산출물(확장자 없는 클린
  # URL 포함)을 먼저 찾고, 못 찾으면 마지막 인자로 **내부 리다이렉트**해 index.html을 반환한다 — 이 내부
  # 리다이렉트는 새 URI(`/index.html`)로 location 매칭을 다시 타므로 위 `location ~* \.html$`의 no-cache
  # 헤더를 그대로 상속한다. 단 `$uri`/`$uri.html`/`$uri/` 중간 후보가 직접 파일로 매치되는 경우(정적으로
  # 사전렌더된 클린 URL 라우트)는 내부 리다이렉트가 아니라 **현재 location(`location /`) 컨텍스트에서 직접
  # 서빙**되므로 그 정규식 location의 헤더를 상속받지 못한다 — 그래서 `location /` 자체에도
  # `add_header Cache-Control "no-cache" always;`를 동일하게 걸어 SW 갱신 정책 3항("index.html 및
  # expo-router 정적 출력의 엔트리 문서는 no-cache")을 어느 경로로 도달하든 정합시킨다.

  server {
    listen 80;
    server_name watch.${DOMAIN};
    root /usr/share/nginx/html/watch;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # SPA 폴백(T-W1-06, 세부 근거는 위 "정적 서빙 3종 공통 패턴" 주석). 이 서브도메인(구독자 웹)이 실제로
    # 보유한 동적 라우트(실측, `find apps/subscriber/app -iname '*[id]*'`): `/watch/:id`·`/live/:id` —
    # 아래 규칙은 그 두 패턴을 포함해 향후 신설분까지 URL을 열거하지 않고 커버한다(닫힌 목록 아님, 위 헤더 주석).
    location / {
      try_files $uri $uri.html $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }

  server {
    listen 80;
    server_name reporter.${DOMAIN};
    root /usr/share/nginx/html/reporter;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # SPA 폴백(T-W1-06, 세부 근거는 위 "정적 서빙 3종 공통 패턴" 주석). 이 서브도메인(기자 웹)이 실제로
    # 보유한 동적 라우트(실측, `find "apps/reporter/app/(app)/contents/[id]" -type f`): `/contents/:id`
    # (+ 하위 `/contents/:id/preview`·`/contents/:id/edit` — 전부 이 규칙 한 줄로 커버, 개별 열거 불요).
    location / {
      try_files $uri $uri.html $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }

  server {
    listen 80;
    server_name center.${DOMAIN};
    root /usr/share/nginx/html/center;
    index index.html;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # SPA 폴백(T-W1-06, 세부 근거는 위 "정적 서빙 3종 공통 패턴" 주석). 이 서브도메인(센터 관제 웹)이
    # 실제로 보유한 동적 라우트(실측, `find "apps/control-center/app/(app)" -iname '*[id]*'`):
    # `/contents/:id`·`/recommendations/:id`·`/live/:id`.
    location / {
      try_files $uri $uri.html $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }

  # ── api. / go. — 정적 아님, services/api(NestJS)로 리버스 프록시 ───────────────
  # api 컨테이너는 REST + socket.io(WS, 라이브 채팅·프롬프터)를 같은 포트(4000)에서 인프로세스로
  # 서빙한다(CLAUDE.md §11) — Upgrade/Connection 헤더를 넘겨야 WS 핸드셰이크가 통과한다.
  server {
    listen 80;
    server_name api.${DOMAIN};

    location / {
      set $upstream_api api:4000;
      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  server {
    listen 80;
    server_name go.${DOMAIN};

    # go.<도메인>/c/<id> 자체(OG SSR·리다이렉트 로직)는 T-W1-05가 api 라우트로 구현했다(D-T6 기본안,
    # `services/api/src/go-link/go-link.controller.ts`). 그 컨트롤러는 전역 프리픽스(`v1`)+컨트롤러
    # 접두(`go`) 조합으로 내부 경로가 `/v1/go/c/:id`(+ `/thumb`)가 되는데, 전역 프리픽스 exclude 확장은
    # T-W1-05 파일 소유권 밖이라(같은 컨트롤러 주석이 "엣지가 이 매핑을 해줄 것"을 명시적으로 기대) 공개
    # 경로 `/c/*`(카톡에 발급되는 실제 링크 형태, GO_LINK_PUBLIC_PATH)를 오리진의 실제 경로로 맞추는
    # 책임이 이 vhost(T-W1-06 소유)에 떨어진다 — 아래 rewrite 1줄이 그 매핑이다. `/c/:id`·`/c/:id/thumb`
    # 둘 다 이 한 줄로 커버(정규식이 `/c/` 뒤 전부를 그대로 옮긴다). `break`라 **내부** 재작성일 뿐 클라이언트로
    # 가는 HTTP 리다이렉트가 아니다 — 카톡 크롤러·사용자에게는 `go.<도메인>/c/<id>`만 보인다. 캐시 헤더는
    # 오리진(api)이 `Cache-Control`/`CDN-Cache-Control`/`stale-if-error`를 직접 계산해 내보내므로(02§D-T6
    # "왜 302가 아니라 200 HTML인가" 소절) 이 vhost는 그 어떤 `add_header`도 걸지 않고 그대로 통과시킨다
    # (정적 vhost의 no-cache 규칙과 달리 여기는 프록시 응답이라 원본 헤더가 이미 정답이다).
    location / {
      # 순서 주의(재현 중 실제로 걸린 함정): `rewrite ... break;`가 `set` 뒤에 오면 nginx는 두 지시어를
      # 같은 rewrite-모듈 처리열로 취급해 `break`가 자신 이후의 `set`까지 건너뛴다 — 그러면
      # `$upstream_api`가 초기화되지 않은 채 proxy_pass로 넘어가 "invalid URL prefix in http://"로
      # 500이 난다(게이트① 재현에서 실제로 재현·확인). `set`을 `rewrite`보다 먼저 둬야 한다.
      set $upstream_api api:4000;
      rewrite ^/c/(.*)$ /v1/go/c/$1 break;

      proxy_pass http://$upstream_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
