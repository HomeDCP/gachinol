name: CI

# lint·typecheck·test 게이트. 이미지 빌드는 build-images.yml, e2e(Postgres 필요)는 별도.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # redis-memory-server(services/api devDep)의 postinstall은 Redis를 **소스 컴파일**한다.
  # ubuntu-latest 러너가 새 GCC/OpenSSL 3.x로 롤포워드되며 그 빌드가 깨졌고(-Wdangling-pointer=,
  # ERR_func_error_string deprecated → make Error 1), pnpm 스토어 캐시가 살아 있는 동안만 가려져 있었다.
  # lockfile을 바꾸는 PR은 캐시 키(actions/setup-node cache: pnpm)가 빠지면서 이 콜드 인스톨 경로를 밟는다.
  #
  # 이 워크플로는 유닛(`pnpm test`)만 돌리고 e2e는 제외하므로(위 헤더 주석) Redis 바이너리가 아예 불필요하다.
  # → postinstall 선다운로드만 끈다. 로컬 개발·e2e는 무영향(바이너리는 런타임에 온디맨드 조달).
  # ⚠️ 이 워크플로에 api e2e 잡을 추가하려면 별도 대응이 필요하다(services 컨테이너로 실 Redis 제공 등)
  #    — 이 변수만으로는 e2e가 런타임에 같은 빌드 실패를 만난다. EXEC-DECISIONS #11 참조.
  REDISMS_DISABLE_POSTINSTALL: '1'

jobs:
  node:
    name: node (lint·typecheck·test)
    runs-on: ubuntu-latest
    env:
      # 유닛 테스트/typecheck가 config를 로드할 때 참조할 수 있는 더미(실제 시크릿 아님).
      # e2e(Postgres·Redis·S3 필요)는 이 워크플로에서 제외 — 별도 잡에서 인프라 기동 후 실행.
      JWT_ACCESS_SECRET: ci_dummy_access_secret_0123456789_abcdef
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_0123456789_uvwxyz
      DATABASE_URL: postgresql://gachinol:gachinol@localhost:5432/gachinol
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 버전은 루트 package.json의 packageManager(pnpm@8.15.0)에서 읽음
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # build(turbo)는 앱 `expo export`까지 돌려 무겁다 → 생략. shared dist는 typecheck/test의
      # dependsOn(^build)로 전이 빌드된다(turbo.json).
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # infra/scripts/ 테스트(`node --test`, 신규 의존 0)는 루트 `package.json`의 `test` 스크립트가
      # `turbo run test && pnpm run test:scripts`로 편입해뒀다 — 위 `pnpm test` 한 스텝이 turbo
      # 워크스페이스 테스트와 infra/scripts 테스트를 함께 돌린다. 별도 스텝을 두지 않는 이유는
      # 대장 #146·#161이 반복해 밟은 "같은 배선이 두 곳에 있으면 한쪽만 고치는 함정"을 피하기
      # 위해서다(로컬 `pnpm test`와 CI가 같은 경로를 타야 드리프트가 없다).
      - name: Test (unit)
        run: pnpm test

  ai-worker:
    name: ai-worker (ruff·pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-worker/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
