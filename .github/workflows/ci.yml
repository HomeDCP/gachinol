name: CI

# lint·typecheck·test 게이트. 이미지 빌드는 build-images.yml, e2e(Postgres 필요)는 별도.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (lint·typecheck·test)
    runs-on: ubuntu-latest
    env:
      # 유닛 테스트/typecheck가 config를 로드할 때 참조할 수 있는 더미(실제 시크릿 아님).
      # e2e(Postgres·Redis·S3 필요)는 이 워크플로에서 제외 — 별도 잡에서 인프라 기동 후 실행.
      JWT_ACCESS_SECRET: ci_dummy_access_secret_0123456789_abcdef
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_0123456789_uvwxyz
      DATABASE_URL: postgresql://gachinol:gachinol@localhost:5432/gachinol
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 버전은 루트 package.json의 packageManager(pnpm@8.15.0)에서 읽음
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # build(turbo)는 앱 `expo export`까지 돌려 무겁다 → 생략. shared dist는 typecheck/test의
      # dependsOn(^build)로 전이 빌드된다(turbo.json).
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (unit)
        run: pnpm test

  ai-worker:
    name: ai-worker (ruff·pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-worker/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
