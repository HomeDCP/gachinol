name: Build Images

# api·media-worker·ai-worker 컨테이너 이미지 빌드.
# - pull_request: 빌드만(푸시 없음) → Dockerfile 회귀 검증
# - main push / 수동: GHCR(ghcr.io/<owner>/gachinol-*)로 푸시(sha + latest 태그)
# 배포(VM에서 compose pull + up)는 서버 확정 후 별도 워크플로로 — docs/infrastructure.md §7.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'services/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api·media-worker는 컨텍스트=리포 루트(pnpm 워크스페이스 전체 필요)
          - name: api
            context: .
            dockerfile: services/api/Dockerfile
          - name: media-worker
            context: .
            dockerfile: services/media-worker/Dockerfile
          # ai-worker는 컨텍스트=자기 디렉토리(Python 단독)
          - name: ai-worker
            context: services/ai-worker
            dockerfile: services/ai-worker/Dockerfile
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gachinol-${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
