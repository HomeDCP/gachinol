name: Build Images

# api·media-worker·ai-worker 컨테이너 이미지 빌드 + 제온 자동 배포 (대장 #180).
# - pull_request: 빌드만(푸시 없음) → Dockerfile 회귀 검증
# - main push / 수동: GHCR(ghcr.io/<owner>/gachinol-*)로 푸시(sha-<7자> + latest + <branch> 태그)
#
# ── 배포(③) — `deploy-web.yml`의 `deploy` 잡을 그대로 복제한 것 (대장 #180) ─────────────────
# 배치를 `deploy-web.yml`(별 파일 + workflow_run)이 아니라 **이 파일에 잡으로 추가**한 이유:
# ① `deploy-web.yml` 자체가 이미 build+deploy를 한 파일에 담은 선례다. ② `needs:`로 빌드→배포
# 순서가 명시적으로 보장된다(workflow_run은 두 워크플로가 성공/실패를 각자 보고해 디버깅이 간접적).
# ③ 이 워크플로가 애초에 만드는 이미지를 그대로 당겨가는 것이라 워크플로 경계를 나눌 이유가 없다.
# preflight(시크릿 존재 판정)·SSH 배포·Environment 승인 게이트·배포 후 SHA 대조까지 구조는 동일하되
# 대상만 api·media-worker·ai-worker 3종으로 바꿨다. **새 시크릿·vars 0개** — `WEB_DEPLOY_*`를 그대로
# 재사용한다(이름이 `WEB_`로 시작하지만 "웹 전용"이 아니라 "제온 배포 전용" 의미다 — 같은 서버,
# 같은 SSH 경로이므로 이름을 새로 만들면 사용자가 시크릿을 다시 입력해야 한다). 아래 `preflight`·
# `deploy` 잡 주석에 재사용 상세를 남긴다.
#
# ── 배포 자동 롤백 (대장 #243 태스크②) ──────────────────────────────────────────────────
# `infra/scripts/deploy-rollback.mjs`(태스크①, 판정·계획 생성기 — 순수 함수, SSH·docker 0회 실행)를
# 이 잡에 배선한다. 배포 직전 3서비스의 복구 지점을 캡처하고, 배포 후 4축(api SHA·라우트·워커
# SHA·미디어 도달성)을 검증해 `decide`가 롤백 여부를 판정한다. **이 PR은 `report` 모드로 머지된다**
# (`deploy-rollback.mjs`의 `DEFAULT_ROLLBACK_MODE` 기본값을 그대로 씀, `--mode` 플래그를 이 워크플로
# 에서 하드코딩하지 않는다) — 판정·계획·복구 런북까지는 생성하되 원격 실행은 하지 않는다. `enforce`로
# 승격하려면 `deploy-rollback.mjs`의 `DEFAULT_ROLLBACK_MODE` 상수를 바꾸는 별도 PR로 한다(그 파일
# 헤더 주석 "mode 승격 절차" 참조 — 승격 이력을 git에 남기기 위해서다). 실행 경로 자체의 증명은
# `.github/workflows/rollback-drill.yml`(수동 드릴, `mode=enforce`)이 프로덕션을 깨지 않고 담당한다.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'services/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  # ⚠️ (대장 #180 동반 수정) 舊 값은 이벤트 무관 `true`였다 — 빌드 전용이던 시절엔 무해했지만
  # (초과된 빌드를 취소해도 손실이 없다), 이제 이 워크플로가 `deploy` 잡(프로덕션 SSH 배포)을
  # 포함하므로 main 푸시가 연달아 들어오면 **진행 중이거나 Environment 승인 대기 중인 배포가
  # 통째로 취소**될 수 있다(워크플로 수준 취소는 잡 단위 concurrency로 막을 수 없다 — 잡이
  # Environment 승인을 기다리는 동안에도 런 자체가 cancelled 되면 그 배포는 조용히 사라진다).
  # `deploy-web.yml`이 이미 겪은 문제라 그 파일의 해법을 그대로 가져온다: PR은 최신 커밋만
  # 의미가 있으니 취소하되, main 푸시는 취소 대신 **큐잉**한다(순서대로 하나씩 실행).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api·media-worker는 컨텍스트=리포 루트(pnpm 워크스페이스 전체 필요)
          - name: api
            context: .
            dockerfile: services/api/Dockerfile
          - name: media-worker
            context: .
            dockerfile: services/media-worker/Dockerfile
          # ai-worker는 컨텍스트=자기 디렉토리(Python 단독)
          - name: ai-worker
            context: services/ai-worker
            dockerfile: services/ai-worker/Dockerfile
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gachinol-${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 빌드 스탬프(대장 #186) — `GET /health/version`(api)·`docker exec printenv GIT_SHA`
          # (media-worker·ai-worker)가 이 값을 노출한다. 각 Dockerfile의 runner 스테이지가
          # `ARG GIT_SHA=unknown`을 다시 선언해 받는다(멀티스테이지는 ARG가 자동 전파되지 않는다).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── preflight (실배포 게이트 판정) — `deploy-web.yml`의 동명 잡 복제 ──────────────────────
  # `deploy-web.yml`의 preflight는 ③(배포)·④(CF 캐시 퍼지) 2개 출력을 계산하지만, 이 워크플로는
  # 배포(SSH pull+up) 1개뿐이다(퍼지 대상인 정적 캐시가 없다) — 그래서 `purge`류 판정은 들어내고
  # `deploy` 판정만 남겼다. 시크릿·vars는 **전부 재사용**(새로 만들지 않음): 같은 제온·같은 SSH
  # 경로이므로 `WEB_DEPLOY_ENABLED`가 이 배포에도 마스터 스위치로 그대로 쓰인다(웹과 백엔드를
  # 따로 끄고 켤 방법이 필요해지면 그때 새 var를 판단 — 지금은 "제온 배포 전체 스위치" 1개로 충분).
  # `github.event_name == 'push'`에서만 돈다 — `workflow_dispatch`(수동 재빌드)는 배포 의도를
  # 명시할 입력이 없으므로(舊 `on:` 미변경 — 새 입력을 추가하면 트리거 정의가 넓어진다) 빌드만 하고
  # 배포는 건너뛴다. PR은 애초에 `if:`에서 걸러진다.
  preflight:
    name: preflight (제온 백엔드 배포 게이트 판정)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      # 파괴적 마이그레이션 사전 확인(대장 #180 잔여 ②) — Environment 승인 요청이 나가기 *전*에
      # 돈다. 승인을 누른 뒤 실패하는 것보다 승인 요청 자체가 안 가는 편이 이르다(승인자는 "배포를
      # 승인"할 뿐 그 마이그레이션이 파괴적인지 화면에서 알 방법이 없다). 이 스텝이 실패하면 이
      # `preflight` 잡 전체가 실패하고, `deploy` 잡(`needs: [build, preflight]`)은 GitHub Actions의
      # 암묵적 success() 결합 규칙에 따라 자동으로 skip된다(별도 조건 추가 불요, 기존 `if:
      # needs.preflight.outputs.deploy == 'true'`가 이미 성공 전제다). `ci.yml`에도 같은 검사가
      # 있다(PR 단계 조기 경보) — 여기는 그것이 어떤 이유로든 뚫렸을 때의 마지막 방어선이다.
      - name: 파괴적 마이그레이션 사전 확인 (대장 #180)
        run: node infra/scripts/check-destructive-migrations.mjs
      - name: 게이트 판정
        id: gate
        env:
          ENABLED: ${{ vars.WEB_DEPLOY_ENABLED }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=""
          # 시크릿 "값"은 절대 출력하지 않는다 — 비어 있는지만 본다.
          [ "$ENABLED" = "true" ]     || missing="$missing vars.WEB_DEPLOY_ENABLED(!=true)"
          [ -n "$COMPOSE_DIR" ]       || missing="$missing vars.WEB_DEPLOY_COMPOSE_DIR"
          [ -n "$TS_ID" ]             || missing="$missing secrets.TS_OAUTH_CLIENT_ID"
          [ -n "$TS_SECRET" ]         || missing="$missing secrets.TS_OAUTH_SECRET"
          [ -n "$SSH_HOST" ]          || missing="$missing secrets.WEB_DEPLOY_SSH_HOST"
          [ -n "$SSH_USER" ]          || missing="$missing secrets.WEB_DEPLOY_SSH_USER"
          [ -n "$SSH_KEY" ]           || missing="$missing secrets.WEB_DEPLOY_SSH_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ]   || missing="$missing secrets.WEB_DEPLOY_SSH_KNOWN_HOSTS"

          deploy=false
          if [ -n "$missing" ]; then
            reason="미설정 항목:$missing"
          else
            deploy=true
            reason="설정 완료 — 배포 수행"
          fi

          {
            echo "### 제온 백엔드(api·media-worker·ai-worker) 배포 게이트"
            echo ""
            echo "- 배포: **$deploy** — $reason"
            echo ""
            echo "설정 절차는 \`.github/workflows/deploy-web.yml\`의 \`preflight\` 잡 주석 참조"
            echo "(이 잡은 그 시크릿·vars를 그대로 재사용한다 — 새로 만들지 않는다)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "배포=$deploy ($reason)"

  # ── deploy (제온 api·media-worker·ai-worker 배포) ────────────────────────────────────────
  deploy:
    name: deploy (api·media-worker·ai-worker → 제온)
    runs-on: ubuntu-latest
    needs: [build, preflight]
    if: needs.preflight.outputs.deploy == 'true'
    # GitHub Environment 승인 게이트(deploy-web.yml과 동일 Environment, CLAUDE.md §0-3·대장 #180) —
    # 이 Environment는 2026-09-02 deploy-web.yml에서 이미 만들어졌고, 그 주석이 "앞으로 추가될
    # 프로덕션 배포 잡(api·워커, 대장 #180)도 같은 Environment를 쓴다"고 예고한 대로다. 새로 만들지 않는다.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # 대장 #243 — 마이그레이션 변경 판정(git diff)의 base가 캡처한 api gitSha(임의의 과거
          # 커밋)일 수 있어 얕은 클론이면 그 커밋을 찾지 못한다. monitor.yml이 같은 이유로 이미
          # fetch-depth: 0을 쓴다(그 파일 주석 참조 — "expect가 workflow_dispatch 오버라이드로
          # 임의 커밋을 가리킬 수 있어 얕은 클론은 그 커밋을 찾지 못한다").
          fetch-depth: 0

      # deploy-web.yml과 동일 — 제온은 가정망이라 러너를 테일넷에 임시 합류시켜 SSH한다.
      - name: Tailscale 합류 (러너 → 테일넷)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # build-images.yml의 `type=sha`(docker/metadata-action 기본값, 위 build 잡 실행 로그로 실측
      # 확인: `sha-<git-sha 앞 7자>`, 예 `sha-fd3fd51`)를 그대로 재현한다. `latest`를 쓰지 않는 이유는
      # 대장 #180 본문 그대로다 — "무엇이 배포됐는지"를 다시 흐리지 않기 위해서. `github.sha`(전체
      # 40자)는 아래 SHA 대조 스텝에서 별도로 쓴다(태그와 검증값은 서로 다른 축 — 태그는 이미지를
      # 고르는 열쇠, GIT_SHA는 그 이미지 *안에* build-arg로 구워진 값).
      - name: IMAGE_TAG 계산 (build-images.yml의 type=sha 규칙과 동일)
        id: imagetag
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts를 시크릿으로 요구한다 — StrictHostKeyChecking=no(MITM 무방비)를 쓰지 않기 위해서다.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ── 동반 의무 (대장 #195) ──────────────────────────────────────────────────────────
      # "web 잡을 복제"가 곧 "compose 파일 자체는 갱신 안 하고 pull&&up만 한다"는 패턴까지 그대로
      # 베끼면, api·워커도 #195(제온이 git 체크아웃이 아니라 파일이 일괄 복사돼 있어 사람이 서버에서
      # compose를 손으로 고치는 일이 생기고 리포와 갈라짐)와 같은 처지가 된다. 그래서 배포 직전에
      # 리포의 compose 2파일을 제온으로 보낸다 — **이 순간부터 리포가 단일 원천**이고, 사람이 서버에서
      # 직접 고친 내용은 다음 배포에서 리포 버전으로 덮인다(그것이 의도다 — #195가 실제로 겪은 역방향
      # 드리프트를 구조적으로 막는다). `.env`는 건드리지 않는다 — 그건 제온에만 있는 시크릿이고
      # 리포에 아예 없다(커밋된 적이 없다).
      # 백업: 기존 compose 관례(`docker-compose.xeon.yml.bak`가 실재)를 따라 덮어쓰기 직전 `.bak`으로
      # 1세대 롤백본을 남긴다(무한 누적 아님 — 매 배포마다 직전 1개만 남도록 덮어쓴다). 롤백이 필요한
      # 사고(예: 파라미터화가 깨진 compose가 배포되는 경우)에서 사람이 SSH로 `mv *.bak *.yml` 한 줄로
      # 되돌릴 수 있게 하는 것이 비용(파일 1개 여분) 대비 이득이 크다고 판단했다.
      - name: compose 파일 동기화 (리포 → 제온, 대장 #195 동반 의무)
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; \
             for f in docker-compose.prod.yml docker-compose.xeon.yml; do \
               if [ -f \"\$f\" ]; then cp \"\$f\" \"\$f.bak\"; fi; \
             done"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o IdentitiesOnly=yes \
            infra/docker/docker-compose.prod.yml infra/docker/docker-compose.xeon.yml \
            "$SSH_USER@$SSH_HOST:$COMPOSE_DIR/"

      # ── 복구 지점 캡처 (대장 #243 태스크② — deploy-rollback.mjs capture 소비) ─────────────
      # pull+up **이전**에 돈다 — 나쁜 배포가 서빙 중인 채로 되돌아갈 대상(옛 이미지)이 없으면 안
      # 된다(무인 배포는 복구 지점이 있을 때만 허용, deploy-rollback.mjs 헤더 주석 그대로). ⚠️
      # **api·워커 공통으로 GIT_SHA는 `docker image inspect`(이미지 자체의 ENV)로 읽는다** — 아래
      # SHA 대조 검증 스텝들처럼 `docker exec printenv`나 `/health/version`을 쓰지 않는다. 그
      # 경로들은 **컨테이너가 살아 있어야** 동작하는데, 캡처는 대상 컨테이너가 크래시 루프에 빠져
      # 있어도(오히려 그럴 때일수록) 복구 지점을 얻어야 한다 — 이미지는 컨테이너 생사와 무관하게
      # `docker inspect`/`docker image inspect`로 조회 가능하다. **이 스텝이 실패하면 아래 배포
      # 스텝은 돌지 않는다**(fail-closed — continue-on-error를 주지 않는다. 뒤 검증 스텝들과 달리
      # 이 스텝의 conclusion이 masking되면 "복구 지점 없이 배포 진입"이라는 정확히 막으려던 사고가
      # 재발한다).
      - name: 복구 지점 캡처 (대장 #243 — 배포 전, fail-closed)
        id: capture
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          : > capture-raw.txt
          for svc in api media-worker ai-worker; do
            line="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "set -euo pipefail; cd '$COMPOSE_DIR'; \
               cid=\$(docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q $svc); \
               if [ -z \"\$cid\" ]; then echo '$svc|||'; exit 0; fi; \
               ref=\$(docker inspect -f '{{.Config.Image}}' \"\$cid\"); \
               imageId=\$(docker inspect -f '{{.Image}}' \"\$cid\"); \
               gitSha=\$(docker image inspect \"\$imageId\" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^GIT_SHA=' | head -1 | cut -d= -f2-); \
               echo \"$svc|\$ref|\$imageId|\$gitSha\"")"
            echo "$line" >> capture-raw.txt
          done
          echo "── 캡처 원본 ──"
          cat capture-raw.txt
          node infra/scripts/deploy-rollback.mjs capture \
            --input capture-raw.txt --run-id "$GITHUB_RUN_ID" --json-out capture.json

      # ── 마이그레이션 변경 판정 (대장 #243) ────────────────────────────────────────────────
      # base=캡처한 api gitSha(지금 서빙 중인 것) · head=이번 배포 대상(github.sha). 결과 파일은
      # deploy-rollback.mjs decide의 `--migrations-file`이 그대로 소비한다(부재=fail-closed,
      # 빈 파일=변경 없음 — 이 둘을 혼동하지 않도록 **git diff 자체가 실패하면 파일을 지운다**,
      # 아래 `rm -f`가 그것이다). `git diff ... > file || true` 관용구를 쓰지 않는 이유: 셸
      # 리다이렉션(`>`)은 명령의 성공 여부와 무관하게 파일을 만든다 — `|| true`와 결합하면 "판정
      # 불능"이 조용히 "변경 없음"으로 둔갑해 스키마 드리프트 감지가 새는 지점이 된다(대장 #243
      # 위임 규율).
      - name: 마이그레이션 변경 판정 (대장 #243 — base=캡처한 api gitSha)
        id: migrations
        run: |
          set -euo pipefail
          base_sha="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('capture.json','utf8')).services.api.gitSha)")"
          echo "base(캡처된 api gitSha)=$base_sha head=$GITHUB_SHA"
          if ! git diff --name-only "$base_sha".."$GITHUB_SHA" -- services/api/prisma/migrations > migrations-changed.txt; then
            echo "git diff 실패 — 마이그레이션 변경 여부 판정 불능(fail-closed, 대장 #243)" >&2
            rm -f migrations-changed.txt
            exit 1
          fi
          echo "변경된 마이그레이션 경로(0건이면 변경 없음):"
          cat migrations-changed.txt

      # 선행 조건: docker-compose.prod.yml의 api·media-worker·ai-worker 서비스가 이미
      # `image: ${REGISTRY:-ghcr.io/homedcp}/gachinol-<서비스>:${IMAGE_TAG:-latest}`로 파라미터화돼
      # 있어(web의 `WEB_IMAGE`와 동형) `IMAGE_TAG` 환경변수 주입만으로 `pull && up --no-build`가
      # 의도대로 동작한다 — compose 파일 자체는 이번 태스크에서 고치지 않는다(요구사항 밖).
      # `web`·`postgres`·`redis`·`minio`·`cloudflared`는 건드리지 않는다(deploy-web이 `web`만
      # 건드리는 것과 같은 최소 반경 원칙).
      # ⚠️ `up`에 `--no-deps` 필수 — `--no-deps` 없이 `up api ...`를 돌리면 compose가 **api의
      #    의존 서비스**(postgres·redis·minio)까지 함께 평가한다(depends_on 그래프상 `web`은 `api`에
      #    의존하는 쪽이라 api를 올려도 딸려 오지 않는다 — `docker compose config`로 실측 확인).
      #    postgres·redis·minio는 IMAGE_TAG로 파라미터화돼 있지 않아 지금은 되돌아갈 값 자체가
      #    없지만, 이 워크플로도 `web` 쪽과 같은 실수(2026-09-02, 대장 #180 직후 — `deploy-web.yml`이
      #    `--no-deps` 없이 `up web`을 돌려 캐시된 옛 `latest` api로 되돌린 사고)를 원리적으로 반복할
      #    수 있으므로 대칭으로 막는다. `pull`은 `--include-deps`를 주지 않는 한 기본이 대상 서비스만
      #    당기므로(compose 기본 동작, `docker compose pull --help` 실측) 여기선 손댈 필요가 없다.
      - name: Deploy over SSH (docker compose pull + up — api·media-worker·ai-worker)
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
          IMAGE_TAG: ${{ steps.imagetag.outputs.tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; \
             export IMAGE_TAG='$IMAGE_TAG'; \
             docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml pull api media-worker ai-worker; \
             docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml up -d --no-build --no-deps api media-worker ai-worker; \
             docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps api media-worker ai-worker"

      # 배포 후 SHA 대조 — api (대장 #186 패턴, `infra/scripts/verify-deployed-sha.mjs --kind api`).
      # ⚠️ 프리픽스 없는 경로다(`/health/version` — 오늘 `/v1/health/version`에서 정정됐다, 대장 #189
      # 계열). web과 달리 정적 파일이 아니라 실행 중인 HTTP 서버이므로 `docker exec <cid> node -e
      # "fetch(...)"`로 **컨테이너 내부에서 자기 자신에게 요청**한다(Dockerfile의 HEALTHCHECK와 같은
      # 방식 — node 내장 fetch만 쓰고 curl 설치 여부에 기대지 않는다).
      # ── (대장 #243 태스크② 재편) ────────────────────────────────────────────────────────
      # `id`+`continue-on-error: true`로 바꿨다 — 이 축이 실패해도 잡을 즉시 죽이지 않고 아래
      # `롤백 판정` 스텝까지 도달시켜야 자동 롤백이 가능하다. 판정은 오직 `steps.verify_api_sha.outcome`
      # 으로 읽는다(`conclusion`은 continue-on-error로 masking되어 항상 'success'가 된다 — outcome은
      # masking 이전의 실제 결과다, GitHub Actions 문서 확인). ⚠️ **`if: failure()`를 쓰지 않는다** —
      # 이 스텝 이전(Tailscale·SSH·pull 자체)이 실패해도 그건 "롤백으로 고칠 수 있는 배포 실패"가
      # 아니라 파이프라인 실패이고, `if: failure()`는 "앞선 아무 스텝 실패"에 반응해 그런 경우에도
      # 롤백을 태울 위험이 있다(대장 #243 위임 규율).
      - name: 검증① api SHA 대조 (GET /health/version)
        id: verify_api_sha
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cid="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; \
             docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q api")"
          if [ -z "$cid" ]; then
            echo "api 컨테이너 ID를 얻지 못함(compose ps -q api 결과 없음) — 배포 확인 불가" >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "docker exec '$cid' node -e \"fetch('http://127.0.0.1:4000/health/version').then(r=>r.text()).then(t=>process.stdout.write(t))\"" \
            > api-version.json
          node infra/scripts/verify-deployed-sha.mjs --kind api --expect "$GIT_SHA" --body-file api-version.json

      # 배포 후 라우트 스모크 — api (대장 #180 잔여분 ①, `infra/scripts/deploy-smoke.mjs`). SHA 대조
      # 직후에 둔다. ⚠️ SHA 일치는 "무엇이 배포됐는가"만 확인하고 "그 안에 라우트가 실제로 있는가"는
      # 원리적으로 못 잡는다 — 라우트를 빠뜨린 이미지도 SHA는 정확히 일치한다. 대장 #180이 스스로
      # 적은 해소 판정 기준이 정확히 이것이다: "의도적으로 라우트를 빠뜨린 이미지를 배포했을 때
      # 파이프라인이 red가 되는 것(뮤테이션 실증)". 위 SHA 대조 스텝과 **동일한 접근 방식**(SSH +
      # `docker exec` — 러너→제온 직접 HTTP 가능 여부는 미확인이라 이미 확립된 경로를 재사용한다,
      # 새 접근 경로를 발명하지 않는다)을 그대로 따른다: 컨테이너 **내부에서** 대상 라우트 5종
      # (`/health/version`·`/health/readiness`·`/v1/feed`·`/v1/contents`·
      # `/v1/resident-uploads/<임의id>`) + 음성 대조 경로(`/v1/__smoke_absent__<임의id>` — 반드시
      # 404가 나와야 판정이 유효하다)를 fetch해 상태 코드를 JSON으로 모으고, 그 결과만 로컬로
      # 가져와 `deploy-smoke.mjs --status-file`로 판정한다.
      #
      # ⭐ (대장 #204) `/health/readiness`는 DB `SELECT 1`까지 재는 유일한 라우트라 200/401/404/5xx를
      # 전부 다르게 취급한다(`deploy-smoke.mjs` 판정 계약 — 정확히 200이어야 통과) + `content-type`도
      # 함께 수집해 넘긴다(SPA 폴백이 200과 함께 text/html을 주는 오염을 판정 쪽에서 걸러낸다).
      # **배포 직후 오탐 방지**: 컨테이너 `start_period`(Dockerfile HEALTHCHECK, 40s) 안에 이 스텝이
      # 돌면 앱이 아직 DB 커넥션 풀을 못 열어 readiness가 일시적으로 503일 수 있다 — 그래서 readiness만
      # **최대 3회, 10초 간격으로 재시도**한다(200이면 즉시 중단, 나머지 라우트는 기존과 동일하게
      # 1회만 본다 — 5xx가 지속되면 그건 재시도로 덮을 문제가 아니라 실제 장애다).
      #
      # ── (대장 #243 태스크② 재편) ────────────────────────────────────────────────────────
      # 미디어 도달성(`--media-base-url`)을 **뺐다** — 아래 별도 "검증③ 미디어 도달성" 스텝으로
      # 분리했다(decide가 그 축을 독립적으로 롤백 안 함/경보만/에스컬레이션 3분기로 다루기 때문 —
      # 이 스텝에 얹어두면 축이 하나로 뭉개진다). `id`+`continue-on-error: true`로 재편한 이유는
      # 검증①과 동일(위 주석 참조).
      - name: 검증② 라우트 스모크 (대장 #180 잔여 ① · 대장 #204 — 5xx·readiness 편입)
        id: verify_routes
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          cid="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; \
             docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q api")"
          if [ -z "$cid" ]; then
            echo "api 컨테이너 ID를 얻지 못함(compose ps -q api 결과 없음) — 스모크 확인 불가" >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "docker exec '$cid' node -e \"(async()=>{const c=require('crypto');const paths=['/health/version','/health/readiness','/v1/feed','/v1/contents','/v1/resident-uploads/'+c.randomUUID()];const absent='/v1/__smoke_absent__'+c.randomUUID();async function probe(p){try{const r=await fetch('http://127.0.0.1:4000'+p);return{path:p,status:r.status,error:null,contentType:r.headers.get('content-type')};}catch(e){return{path:p,status:null,error:String(e&&e.message?e.message:e)};}}function sleep(ms){return new Promise(res=>setTimeout(res,ms));}async function probeReadiness(p){let last;for(let i=0;i<3;i++){last=await probe(p);if(last.status===200)return last;if(i<2)await sleep(10000);}return last;}const routes=[];for(const p of paths){routes.push(p==='/health/readiness'?await probeReadiness(p):await probe(p));}const a=await probe(absent);process.stdout.write(JSON.stringify({routes:routes,absent:a}));})();\"" \
            > smoke-status.json
          node infra/scripts/deploy-smoke.mjs --status-file smoke-status.json

      # ── 검증③ 미디어 도달성 (대장 #169·#243 — ②에서 분리) ───────────────────────────────
      # `media-reachability.mjs`(monitor-freshness.mjs와 동일 판정 함수 재사용, 사본 없음)가 이
      # 값으로 GET /v1/feed·GET /v1/feed/:id/playback을 **러너에서 직접**(SSH/docker exec 경유
      # 아님) 호출해, 응답에 실린 미디어 URL(thumbnailUrl·hlsUrl·posterUrl)이 인터넷에서 실제로
      # 도달 가능한지 검사한다. ⚠️ 컨테이너 내부(docker exec)에서 돌리면 안 된다 — 제온과 같은
      # LAN이라 사설 IP도 멀쩡히 열려 원 결함(#169)이 다시 숨는다(LAN 내부에서는 통과하고 인터넷에서는
      # 막히는 것이 애초의 사고였다). `--json-out`(태스크① 산출물, deploy-rollback.mjs가 이 판정
      # JSON을 축 입력으로 그대로 소비하도록 media-reachability.mjs에 추가된 플래그)로 받은 판정을
      # 아래 `롤백 판정` 스텝의 `--media-json`으로 그대로 넘긴다 — 재분류는 deploy-rollback.mjs
      # (`classifyMediaVerdictForRollback`) 몫이라 이 스텝에서 사본을 만들지 않는다.
      # **舊 MEDIA_BASE_URL 빈 값 fail-closed를 이 스텝으로 옮겼다**(舊 검증②에 있던 것). 실패
      # 모드(빈 URL·스크립트 비정상 종료)에서도 **항상 media-verdict.json을 만든다** — 그래야 뒤
      # `decide` 스텝이 파일 부재로 크래시하는 대신 "미지 코드"로 정상 경유해 사람에게 에스컬레이션
      # 한다(요구사항 밖의 견고화이지만 워크플로 파일 안에서만 처리했고 media-reachability.mjs는
      # 건드리지 않았다).
      - name: 검증③ 미디어 도달성 (대장 #169·#243)
        id: verify_media
        continue-on-error: true
        env:
          MEDIA_BASE_URL: ${{ vars.WEB_EXPO_PUBLIC_API_URL }}
        run: |
          set +e
          echo "미디어 도달성 검사 대상(--api-url): ${MEDIA_BASE_URL:-<비어있음>}"
          if [ -z "$MEDIA_BASE_URL" ]; then
            echo "vars.WEB_EXPO_PUBLIC_API_URL이 비어 있음 — 조용히 건너뛸 수 없음(fail-closed, 대장 #169·#243)" >&2
            printf '%s' '{"ok":false,"failures":[{"code":"media-base-url-empty","failureKinds":["media-base-url-empty"]}],"warnings":[],"targets":[]}' > media-verdict.json
            exit 1
          fi
          node infra/scripts/media-reachability.mjs --api-url "$MEDIA_BASE_URL" --json-out media-verdict.json
          exit_code=$?
          if [ ! -f media-verdict.json ]; then
            echo "media-reachability.mjs가 media-verdict.json을 만들지 못함(비정상 종료) — 미지 코드로 표시" >&2
            printf '%s' '{"ok":false,"failures":[{"code":"media-reachability-crashed","failureKinds":["media-reachability-crashed"]}],"warnings":[],"targets":[]}' > media-verdict.json
          fi
          exit "$exit_code"

      # 배포 후 SHA 대조 — media-worker·ai-worker. 둘 다 HTTP를 노출하지 않는 순수 워커라
      # `verify-deployed-sha.mjs`는 이 케이스를 지원하지 않는다(`--kind`는 web|api만 — 스크립트는
      # 고치지 않는다, 이번 태스크 범위 밖). 대신 각 Dockerfile의 runner 스테이지가 `ENV GIT_SHA=`로
      # 빌드 스탬프를 구워 두므로(위 build 잡 build-args와 동형) `docker exec printenv GIT_SHA`로
      # 직접 대조한다. ⚠️ fail-closed가 핵심이다 — 컨테이너 미검출·값 공백·불일치 **어느 경우든
      # 해당 서비스는 fail**로 기록한다.
      #
      # ── (대장 #243 태스크② 재편) ────────────────────────────────────────────────────────
      # `decide`가 `--media-worker-sha-status`/`--ai-worker-sha-status`를 **따로** 받으므로, 이
      # 스텝도 두 서비스 결과를 각각 `$GITHUB_OUTPUT`으로 낸다. `set -e`를 쓰지 않는다(`set +e`) —
      # 한쪽 서비스 확인이 중간에 실패해도(ssh 오류 등) 반드시 두 서비스분 출력을 전부 내야 뒤
      # `decide` 스텝이 안전하게 읽는다(부분 출력 누락은 빈 문자열 status로 이어져 decide의 ok|fail
      # 검증에서 즉시 걸린다 — 그래도 조용한 통과보다 명시적 실패가 낫다).
      - name: 검증④ 워커 SHA 대조 — media-worker·ai-worker
        id: verify_workers
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set +e
          fail=0
          declare -A status
          declare -A reason
          for svc in media-worker ai-worker; do
            cid="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "set -euo pipefail; cd '$COMPOSE_DIR'; \
               docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q $svc")"
            if [ -z "$cid" ]; then
              status[$svc]=fail
              reason[$svc]="컨테이너 ID를 얻지 못함(compose ps -q $svc 결과 없음)"
              fail=1
              continue
            fi
            actual="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "docker exec '$cid' printenv GIT_SHA" 2>/dev/null)"
            if [ -z "$actual" ]; then
              status[$svc]=fail
              reason[$svc]="GIT_SHA 미검출(printenv 빈 값)"
              fail=1
            elif [ "$actual" != "$GIT_SHA" ]; then
              status[$svc]=fail
              reason[$svc]="SHA 불일치: 기대=$GIT_SHA 실제=$actual"
              fail=1
            else
              status[$svc]=ok
              reason[$svc]="SHA 일치 확인: $actual"
              echo "SHA 일치 확인($svc): $actual"
            fi
          done
          {
            echo "media_worker_status=${status[media-worker]:-fail}"
            echo "media_worker_reason=${reason[media-worker]:-검사 미완료}"
            echo "ai_worker_status=${status[ai-worker]:-fail}"
            echo "ai_worker_reason=${reason[ai-worker]:-검사 미완료}"
          } >> "$GITHUB_OUTPUT"
          exit "$fail"

      # ── 롤백 판정 (대장 #243 태스크②) ────────────────────────────────────────────────────
      # `--mode`를 주지 않는다 — `deploy-rollback.mjs`의 `DEFAULT_ROLLBACK_MODE`(현재 `report`)를
      # 그대로 쓴다. **enforce 승격은 이 워크플로가 아니라 그 상수를 바꾸는 PR로 한다**
      # (`deploy-rollback.mjs` 헤더 주석 "mode 승격 절차" — 여기서 하드코딩하면 승격 이력이 워크플로
      # diff에 묻혀 그 절차 자체가 무의미해진다).
      - name: 롤백 판정 (대장 #243)
        id: decide
        run: |
          set -euo pipefail
          node infra/scripts/deploy-rollback.mjs decide \
            --capture-file capture.json \
            --migrations-file migrations-changed.txt \
            --run-id "$GITHUB_RUN_ID" \
            --api-sha-status ${{ steps.verify_api_sha.outcome == 'success' && 'ok' || 'fail' }} \
            --api-sha-reason "step outcome=${{ steps.verify_api_sha.outcome }}" \
            --routes-status ${{ steps.verify_routes.outcome == 'success' && 'ok' || 'fail' }} \
            --routes-reason "step outcome=${{ steps.verify_routes.outcome }}" \
            --media-worker-sha-status "${{ steps.verify_workers.outputs.media_worker_status }}" \
            --media-worker-sha-reason "${{ steps.verify_workers.outputs.media_worker_reason }}" \
            --ai-worker-sha-status "${{ steps.verify_workers.outputs.ai_worker_status }}" \
            --ai-worker-sha-reason "${{ steps.verify_workers.outputs.ai_worker_reason }}" \
            --media-json media-verdict.json \
            --json-out decide.json
          rollback="$(node -e "console.log(JSON.parse(require('fs').readFileSync('decide.json','utf8')).rollback)")"
          escalate="$(node -e "const d=JSON.parse(require('fs').readFileSync('decide.json','utf8'));console.log(d.escalate||'')")"
          enforce="$(node -e "console.log(JSON.parse(require('fs').readFileSync('decide.json','utf8')).enforce)")"
          {
            echo "rollback=$rollback"
            echo "escalate=$escalate"
            echo "enforce=$enforce"
          } >> "$GITHUB_OUTPUT"

      # ── 롤백 실행 (대장 #243 — enforce 모드일 때만) ─────────────────────────────────────
      # ⛔ 이 스텝은 원격 명령을 조립하지 않는다 — `decide.json`의 `plan.remoteCommand`
      # (`generateRollbackPlan` 산출물)를 그대로 ssh에 넘긴다. 2026-09-12 사고(대장 #215, 사람이
      # 명령을 손으로 조립하다 `IMAGE_TAG`를 빠뜨림)를 구조적으로 반복하지 않기 위함이다.
      # report 모드(이 PR의 기본값)에서는 `decide.outputs.enforce`가 항상 'false'라 이 스텝은 항상
      # skip된다 — 실행 없이 판정·계획 생성까지만 하는 것이 report 모드의 정의다(deploy-rollback.mjs
      # 헤더 "서브커맨드 4개" 절).
      - name: 롤백 실행 (대장 #243 — enforce 모드에서만)
        id: rollback_exec
        if: steps.decide.outputs.rollback == 'true' && steps.decide.outputs.enforce == 'true'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          remote_command="$(node -e "console.log(JSON.parse(require('fs').readFileSync('decide.json','utf8')).plan.remoteCommand)")"
          echo "원격 실행 명령(생성기 산출물 그대로 — 사람이 조립하지 않음):"
          echo "$remote_command"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; $remote_command"

      # ── 롤백 후 재검증 (대장 #243 — 축 ①②④만, 미디어 제외) ──────────────────────────────
      # 미디어를 뺀 이유: 외부(Cloudflare·MinIO) flake가 "롤백 자체는 성공했는데 재검증만 오염되는"
      # 결과를 만들 수 있다(위임 규율 그대로 — 외부 요인이 escalate/재검증 판정을 흔들면 안 된다).
      # 기대 SHA=**캡처한 gitSha**(롤백이 되돌아간 대상, `github.sha`가 아니다).
      - name: 롤백 후 재검증 — api SHA·라우트·워커 SHA (미디어 제외)
        id: reverify
        if: always() && steps.rollback_exec.outcome != 'skipped'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.WEB_DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_DEPLOY_SSH_USER }}
          SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.WEB_DEPLOY_COMPOSE_DIR }}
        run: |
          set +e
          fail=0
          reasons=()

          expect_api_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('capture.json','utf8')).services.api.gitSha)")"
          cid_api="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd '$COMPOSE_DIR'; docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q api")"
          if [ -z "$cid_api" ]; then
            fail=1; reasons+=("api 컨테이너 없음")
          else
            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "docker exec '$cid_api' node -e \"fetch('http://127.0.0.1:4000/health/version').then(r=>r.text()).then(t=>process.stdout.write(t))\"" \
              > reverify-api-version.json; then
              if ! node infra/scripts/verify-deployed-sha.mjs --kind api --expect "$expect_api_sha" --body-file reverify-api-version.json; then
                fail=1; reasons+=("api SHA 불일치(기대=$expect_api_sha)")
              fi
            else
              fail=1; reasons+=("api 재검증 응답 실패")
            fi

            if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "docker exec '$cid_api' node -e \"(async()=>{const paths=['/health/version','/health/readiness','/v1/feed'];const out=[];for(const p of paths){try{const r=await fetch('http://127.0.0.1:4000'+p);out.push({path:p,status:r.status,error:null,contentType:r.headers.get('content-type')});}catch(e){out.push({path:p,status:null,error:String(e&&e.message?e.message:e)});}}process.stdout.write(JSON.stringify({routes:out,absent:{path:'/v1/__smoke_absent__',status:404}}));})();\"" \
              > reverify-smoke-status.json; then
              if ! node infra/scripts/deploy-smoke.mjs --status-file reverify-smoke-status.json; then
                fail=1; reasons+=("라우트 재검증 실패")
              fi
            else
              fail=1; reasons+=("라우트 재검증 응답 실패")
            fi
          fi

          for svc in media-worker ai-worker; do
            expect_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('capture.json','utf8')).services['$svc'].gitSha)")"
            cid="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
              "set -euo pipefail; cd '$COMPOSE_DIR'; docker compose -f docker-compose.prod.yml -f docker-compose.xeon.yml ps -q $svc")"
            if [ -z "$cid" ]; then
              fail=1; reasons+=("$svc 컨테이너 없음"); continue
            fi
            actual="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "docker exec '$cid' printenv GIT_SHA" 2>/dev/null)"
            if [ "$actual" != "$expect_sha" ]; then
              fail=1; reasons+=("$svc SHA 불일치(기대=$expect_sha 실제=${actual:-미검출})")
            fi
          done

          if [ "${#reasons[@]}" -eq 0 ]; then
            reason_joined="복구 지점으로 정상 서빙 확인"
          else
            reason_joined="$(IFS='; '; echo "${reasons[*]}")"
          fi
          ok_json=false
          [ "$fail" -eq 0 ] && ok_json=true
          printf '{"ok":%s,"reason":"%s"}' "$ok_json" "$reason_joined" > reverify.json
          cat reverify.json
          exit "$fail"

      # ── 최종 판정 + 복구 런북 (대장 #243 — CI를 실제로 막는 유일한 관문) ───────────────────
      # `!cancelled()` — 사용자가 잡을 취소한 게 아니라면 위 어떤 스텝이 실패했어도 반드시 돈다.
      # 축 실패·롤백 수행·escalate·재검증 실패 중 하나라도 있으면 이 스텝이 exit 1로 잡 전체를
      # red로 만든다(`computeFinalVerdict` — 롤백 성공을 초록으로 덮지 않는다).
      - name: 최종 판정 + 복구 런북 (대장 #243)
        id: verdict
        if: ${{ !cancelled() }}
        run: |
          set +e
          reverify_args=()
          if [ -f reverify.json ]; then
            reverify_ok="$(node -e "console.log(JSON.parse(require('fs').readFileSync('reverify.json','utf8')).ok ? 'ok' : 'fail')")"
            reverify_reason="$(node -e "console.log(JSON.parse(require('fs').readFileSync('reverify.json','utf8')).reason || '')")"
            reverify_args=(--reverify-status "$reverify_ok" --reverify-reason "$reverify_reason")
          fi
          node infra/scripts/deploy-rollback.mjs verdict \
            --decide-file decide.json \
            --capture-file capture.json \
            --run-id "$GITHUB_RUN_ID" \
            "${reverify_args[@]}" \
            --summary-out recovery-runbook.md \
            --json-out verdict.json
          verdict_exit=$?
          if [ -f recovery-runbook.md ]; then
            cat recovery-runbook.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$verdict_exit"
